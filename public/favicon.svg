<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Laser Beam Glow -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Document Body Shadow -->
  <path d="M140 100 H310 L392 182 V392 C392 405 381 416 368 416 H140 C127 416 116 405 116 392 V124 C116 111 127 100 140 100 Z" fill="#0f172a" opacity="0.18" transform="translate(0, 10)" />

  <!-- Document Body (Crisp Paper) -->
  <path d="M140 100 H310 L392 182 V392 C392 405 381 416 368 416 H140 C127 416 116 405 116 392 V124 C116 111 127 100 140 100 Z" fill="#ffffff" />

  <!-- Document Folded Corner -->
  <path d="M310 100 V162 C310 173 321 182 332 182 H392 Z" fill="url(#foldGrad)" />

  <!-- Simulated Document Text Lines -->
  <rect x="160" y="220" width="130" height="14" rx="7" fill="#cbd5e1" />
  <rect x="160" y="252" width="190" height="14" rx="7" fill="#cbd5e1" />
  <rect x="160" y="284" width="160" height="14" rx="7" fill="#cbd5e1" />
  <rect x="160" y="316" width="120" height="14" rx="7" fill="#cbd5e1" />

  <!-- Scanning Ray (Glowing Laser Beam) -->
  <rect x="80" y="246" width="352" height="26" fill="url(#beamGrad)" filter="url(#glow)" />
  <rect x="96" y="256" width="320" height="6" rx="3" fill="#ffffff" />

  <!-- Easy Sparkle / Magic Flash (Top-right accent) -->
  <path d="M400 90 L412 120 L442 132 L412 144 L400 174 L388 144 L358 132 L388 120 Z" fill="#facc15" />
</svg>
